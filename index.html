<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness Calendar</title>
<style>
  :root {
    --bg:#0f1117; --card:#181b24; --cell:#262a36; --line:#262a36; --text:#e8eaf0; --muted:#8b91a3;
    --strength:#9B72F5; --steps:#3B82F6; --core:#FB923C; --bike:#2DD4BF; --check:#F472B6;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:12px 8px 32px; }
  .wrap { max-width:520px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .head h1 { font-size:20px; margin:0; }
  .nav { display:flex; gap:6px; }
  .nav button { background:var(--cell); color:var(--text); border:0; border-radius:8px; width:36px; height:32px; font-size:18px; cursor:pointer; }

  .dow, .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .dow div { text-align:center; font-size:12px; color:var(--muted); padding-bottom:4px; }
  .cell { aspect-ratio:1/1.15; border-radius:8px; background:var(--cell); padding:3px 4px; display:flex; flex-direction:column; justify-content:space-between; }
  .cell.out { opacity:.4; }
  .cell.future { background:transparent; box-shadow:inset 0 0 0 1px var(--line); }
  .cell.today { outline:2px solid var(--text); outline-offset:1px; }
  .cell .n { font-size:11px; color:var(--muted); }
  .marks { display:flex; gap:2px; flex-wrap:wrap; }
  .m { width:8px; height:8px; border-radius:50%; border:1.25px solid; display:inline-block; }
  .m.steps { border-color:var(--steps); }  .m.steps.on { background:var(--steps); }
  .m.str   { border-color:var(--strength); } .m.str.on { background:var(--strength); }
  .m.core  { border-color:var(--core); }   .m.core.on { background:var(--core); }
  .m.bike  { border-color:var(--bike); }   .m.bike.on { background:var(--bike); }

  .wkchecks { grid-column:1 / -1; display:flex; justify-content:space-between; padding:2px 4px 8px; gap:4px; }
  .wkchecks:empty { display:none; }
  .wc { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); }
  .wc .b { width:18px; height:18px; border-radius:50%; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff; flex:none; }
  .wc.ok { color:var(--text); }
  .wc.ok .b { border:0; background:var(--check); }

  .legend { display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:14px; color:var(--muted); font-size:11px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .note { color:var(--muted); font-size:11px; margin-top:14px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <h1 id="title"></h1>
      <div class="nav"><button id="prev" aria-label="Previous month">&lsaquo;</button><button id="next" aria-label="Next month">&rsaquo;</button></div>
    </div>
    <div class="dow"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="m steps on"></i>Steps &ge; 9k</span>
      <span><i class="m str on"></i>Strength</span>
      <span><i class="m core on"></i>Core</span>
      <span><i class="m bike on"></i>Bike 20 min</span>
      <span>Hollow = not done</span>
    </div>
    <div class="legend" style="margin-top:8px">
      <span><i class="dot" style="background:var(--check)"></i>Week checks (Mon&ndash;Sun, shown after Sunday): Steps = 9k every day &middot; Core+Bike = every non-strength day &middot; Strength = 3 sessions</span>
    </div>
  </div>
  <div class="note">Updated 2026-10-12</div>
</div>

<script>
  // [strength 0/1, core 0/1, bike minutes] per date
  const DAYS  = {"2023-08-15": [1, 0, 0], "2023-08-24": [1, 0, 0], "2024-02-05": [1, 0, 0], "2024-02-19": [1, 0, 0], "2024-03-05": [1, 0, 0], "2024-04-05": [1, 0, 0], "2024-06-18": [1, 0, 0], "2024-07-04": [1, 0, 0], "2024-07-06": [1, 0, 0], "2024-07-25": [1, 0, 0], "2024-07-28": [1, 0, 0], "2024-07-30": [0, 0, 25], "2024-08-01": [1, 0, 0], "2024-08-11": [1, 0, 0], "2024-08-13": [1, 0, 0], "2024-08-26": [1, 0, 0], "2025-01-07": [1, 0, 0], "2025-01-27": [1, 0, 0], "2025-02-05": [1, 0, 0], "2025-08-17": [1, 0, 0], "2025-08-26": [1, 0, 0], "2025-08-28": [1, 0, 0], "2025-09-29": [1, 0, 0], "2025-10-01": [1, 0, 0], "2025-10-03": [1, 0, 0], "2025-10-06": [1, 0, 0], "2025-10-08": [1, 0, 0], "2025-10-14": [1, 0, 0], "2025-10-16": [1, 0, 0], "2025-10-17": [1, 0, 0], "2025-10-20": [1, 0, 0], "2025-10-25": [1, 0, 0], "2025-10-26": [1, 0, 0], "2025-10-27": [1, 0, 0], "2025-11-09": [1, 0, 0], "2025-11-17": [1, 0, 0], "2025-11-18": [1, 0, 0], "2025-11-22": [1, 0, 0], "2025-11-25": [1, 0, 0], "2025-11-26": [1, 0, 0], "2025-12-02": [1, 0, 0], "2025-12-03": [1, 0, 0], "2025-12-08": [1, 0, 0], "2025-12-10": [1, 0, 0], "2025-12-11": [1, 0, 0], "2026-01-06": [1, 0, 0], "2026-01-12": [1, 0, 0], "2026-01-13": [1, 0, 0], "2026-01-17": [1, 0, 0], "2026-01-21": [1, 0, 0], "2026-01-24": [1, 0, 0], "2026-01-28": [1, 0, 0], "2026-01-29": [1, 0, 0], "2026-01-30": [1, 0, 0], "2026-02-05": [1, 0, 0], "2026-03-02": [1, 0, 0], "2026-03-04": [1, 0, 0], "2026-03-07": [1, 0, 0], "2026-03-23": [1, 0, 0], "2026-03-27": [1, 0, 0], "2026-04-20": [1, 0, 0], "2026-04-22": [1, 0, 0], "2026-04-23": [1, 0, 0], "2026-05-05": [1, 0, 0], "2026-05-08": [1, 0, 0], "2026-05-18": [1, 0, 0], "2026-05-19": [1, 0, 0], "2026-05-25": [1, 0, 0], "2026-05-26": [1, 0, 0], "2026-06-03": [1, 0, 0], "2026-06-05": [1, 0, 0], "2026-06-09": [1, 0, 0], "2026-06-12": [1, 0, 0], "2026-06-14": [1, 0, 0], "2026-06-17": [1, 0, 0], "2026-06-18": [1, 0, 0], "2026-06-23": [1, 0, 0], "2026-06-24": [1, 0, 0], "2026-07-21": [1, 0, 0], "2026-07-27": [1, 0, 0], "2026-07-30": [1, 0, 0], "2026-08-05": [1, 0, 0], "2026-08-14": [1, 0, 0], "2026-08-17": [1, 0, 0], "2026-08-20": [1, 0, 0], "2026-08-21": [1, 0, 0], "2026-09-01": [1, 0, 0], "2026-09-05": [1, 0, 0], "2026-09-09": [1, 0, 0], "2026-09-30": [1, 0, 0], "2026-10-07": [1, 0, 0], "2026-10-12": [1, 0, 25]};
  const STEPS = {"2026-08-30": 8099, "2026-08-31": 7463, "2026-09-01": 5640, "2026-09-02": 9160, "2026-09-03": 4121, "2026-09-04": 6802, "2026-09-05": 8410, "2026-09-06": 10440, "2026-09-07": 8528, "2026-09-08": 9460, "2026-09-09": 6329, "2026-09-10": 7641, "2026-09-11": 3972, "2026-09-12": 8877, "2026-09-13": 3489, "2026-09-14": 6978, "2026-09-15": 12140, "2026-09-16": 3761, "2026-09-17": 7998, "2026-09-18": 12409, "2026-09-19": 10155, "2026-09-20": 11850, "2026-09-21": 9344, "2026-09-22": 4544, "2026-09-23": 1086, "2026-09-24": 6479, "2026-09-25": 5308, "2026-09-26": 3919, "2026-09-27": 7895, "2026-09-28": 0, "2026-09-29": 244, "2026-09-30": 3631, "2026-10-01": 11310, "2026-10-02": 18515, "2026-10-03": 13698, "2026-10-04": 7759, "2026-10-05": 6348, "2026-10-06": 9180, "2026-10-07": 9985, "2026-10-08": 9708, "2026-10-09": 19712, "2026-10-10": 5512, "2026-10-11": 2845, "2026-10-12": 5687};

  const STEP_GOAL = 9000, BIKE_GOAL = 20, STRENGTH_GOAL = 3;
  const TRACK_START = '2026-10-12';   // week checks and hollow markers begin here (a Monday)

  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

  const TODAY = iso(new Date());
  let view = parse(TODAY); view.setDate(1);

  function info(ds) {
    const [str, core, bike] = DAYS[ds] || [0, 0, 0];
    const steps = STEPS[ds];
    return { str: !!str, core: !!core, bike: bike >= BIKE_GOAL, steps: steps != null && steps >= STEP_GOAL, hasSteps: steps != null };
  }

  function marks(ds) {
    const i = info(ds), tracked = ds >= TRACK_START;
    const m = (cls, on) => `<i class="m ${cls} ${on ? 'on' : ''}"></i>`;
    let h = '';
    if (tracked || i.hasSteps && i.steps) h += m('steps', i.steps);
    if (i.str) return h + m('str', true);
    if (tracked) return h + m('core', i.core) + m('bike', i.bike);
    return h + (i.core ? m('core', true) : '') + (i.bike ? m('bike', true) : '');
  }

  function weekChecks(monday) {
    const days = [...Array(7)].map((_, k) => iso(addDays(monday, k)));
    if (days[0] < TRACK_START || days[6] >= TODAY) return '<div class="wkchecks"></div>';   // untracked or unfinished
    const inf = days.map(info);
    const steps = inf.every(i => i.steps);
    const cb    = inf.every(i => i.str || (i.core && i.bike));
    const str   = inf.filter(i => i.str).length >= STRENGTH_GOAL;
    const row = (ok, label) => `<div class="wc ${ok ? 'ok' : ''}"><span class="b">${ok ? '&#10003;' : ''}</span>${label}</div>`;
    return `<div class="wkchecks">${row(steps, 'Steps')}${row(cb, 'Core+Bike')}${row(str, 'Strength')}</div>`;
  }

  function render() {
    const y = view.getFullYear(), mo = view.getMonth();
    document.getElementById('title').textContent = view.toLocaleString('en-US', { month: 'long', year: 'numeric' });
    const first = new Date(y, mo, 1), last = new Date(y, mo + 1, 0);
    let cur = addDays(first, -((first.getDay() + 6) % 7));          // Monday on/before the 1st
    let html = '';
    while (cur <= last) {
      const monday = new Date(cur);
      for (let k = 0; k < 7; k++, cur = addDays(cur, 1)) {
        const ds = iso(cur), out = cur.getMonth() !== mo;
        let cls = 'cell' + (out ? ' out' : '');
        let inner = `<span class="n">${cur.getDate()}</span>`;
        if (ds > TODAY) cls += ' future';
        else inner += `<div class="marks">${marks(ds)}</div>`;
        if (ds === TODAY) cls += ' today';
        html += `<div class="${cls}">${inner}</div>`;
      }
      html += weekChecks(monday);
    }
    document.getElementById('grid').innerHTML = html;
  }

  document.getElementById('prev').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); };
  document.getElementById('next').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); };
  render();
</script>
</body>
</html>
